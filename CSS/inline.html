<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline CSS Sample</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #3406ffb8 100%);
            color: #333;
        }

        .page-title {
            margin: 0;
            padding: 30px 20px;
            background: #3b82f6;
            color: #fff;
            text-align: center;
            font-size: 2rem;
            letter-spacing: 0.02em;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
        }

        .page-text {
            max-width: 700px;
            margin: 30px auto;
            padding: 0 20px;
            line-height: 1.8;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <h1 class="page-title">Welcome to CSS</h1>
    <p class="page-text">This example shows how to use inline CSS inside a style block in the HTML head. It styles the page background, heading, and paragraph text for a simple, attractive layout.</p>
</body>
</html>
