<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f5f7fa;
        }
        h1 {
            color: #1f4e79;
        }
        section {
            margin-bottom: 25px;
        }
        img, video, iframe {
            max-width: 100%;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <h1>Multimedia Demo</h1>

    <section>
        <h2>Image</h2>
        <img src="https://www.w3schools.com/html/pic_trulli.jpg" alt="Sample JPG image" width="200" height="200">
    </section>

    <section>
        <h2>Video</h2>
        <video width="300" height="200" controls>
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        </video>
    </section>

    <section>
        <h2>YouTube Video</h2>
        <iframe
            width="300"
            height="200"
            src="https://www.youtube.com/embed/dQw4w9WgXcQ"
            allowfullscreen>
        </iframe>
    </section>

    <section>
        <h2>Map</h2>
        <iframe
            src="https://www.google.com/maps?q=New%20York&z=13&output=embed"
            width="600"
            height="300"
            style="border:0;"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade">
        </iframe>
    </section>
<hr>
<a href="pdf/sample.pdf" download>Download Sample PDF</a>
</body>
</html>
